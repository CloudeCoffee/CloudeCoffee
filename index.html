<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#aab9ff;color:#071768}button,a{font:inherit}.page{position:relative;width:min(100%,430px);min-height:932px;margin:auto;overflow:hidden;background:radial-gradient(circle at 52% 11%,rgba(255,255,255,.78),transparent 22%),linear-gradient(180deg,#8aa9ff 0%,#a8b7ff 43%,#9eafff 76%,#aab9ff 100%);isolation:isolate}
/* cloud system: independent decoration, not a screenshot */
.cloud{position:absolute;z-index:0;filter:drop-shadow(0 10px 18px rgba(75,76,180,.18));opacity:.98}.cloud i{position:absolute;display:block;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff 0 18%,#f5eeff 43%,#c9c8ff 72%,#a7a7f1 100%);box-shadow:inset -9px -10px 20px rgba(114,98,213,.12),inset 7px 7px 16px rgba(255,255,255,.7)}
.c1{width:180px;height:140px;left:-60px;top:10px}.c2{width:160px;height:130px;right:-58px;top:-10px}.c3{width:105px;height:85px;right:-18px;top:143px}.c4{width:85px;height:70px;left:-35px;top:254px}.c5{width:90px;height:72px;right:-36px;top:360px}.c6{width:82px;height:68px;left:-35px;top:452px}.c7{width:78px;height:62px;left:-20px;top:632px}.c8{width:95px;height:72px;right:-30px;top:690px}.c9{width:76px;height:60px;left:32px;top:707px}.cloud i:nth-child(1){width:58%;height:58%;left:3%;bottom:5%}.cloud i:nth-child(2){width:68%;height:68%;left:25%;bottom:4%}.cloud i:nth-child(3){width:54%;height:54%;left:55%;bottom:10%}.cloud i:nth-child(4){width:47%;height:47%;left:34%;top:0}
.content{position:relative;z-index:3;padding-top:32px}.brand{height:137px;display:flex;justify-content:center;align-items:center}.brand img{width:265px;height:150px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(24,31,127,.06))}.tagline{text-align:center;font-weight:500;font-size:17px;line-height:1.28;color:#111d6b;margin:-4px 0 8px}.address{width:225px;height:39px;margin:0 auto 13px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:14px;box-shadow:0 7px 15px rgba(58,65,158,.15);text-decoration:none;color:inherit}.pin{width:14px;height:18px;background:#3f48d8;border-radius:50% 50% 50% 0;transform:rotate(-45deg);position:relative}.pin:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;left:4px;top:4px}.pinwrap{transform:rotate(45deg);display:block}

.bottom{position:relative;height:262px;margin-top:4px;z-index:2}.cup{position:absolute;z-index:3;width:190px;left:50%;transform:translateX(-50%) rotate(4deg);top:16px;filter:drop-shadow(0 13px 15px rgba(65,61,161,.23))}.bottomclouds{position:absolute;left:-35px;right:-35px;bottom:-15px;height:130px;z-index:4}.bottomclouds i{position:absolute;border-radius:50%;background:radial-gradient(circle at 42% 28%,#fff 0 18%,#f5f1ff 48%,#d6d8ff 77%,#bdc3ff 100%);box-shadow:inset -8px -10px 18px rgba(98,94,198,.10)}.bottomclouds i:nth-child(1){width:125px;height:105px;left:0;bottom:0}.bottomclouds i:nth-child(2){width:150px;height:120px;left:72px;bottom:-8px}.bottomclouds i:nth-child(3){width:150px;height:118px;left:178px;bottom:-2px}.bottomclouds i:nth-child(4){width:150px;height:120px;right:65px;bottom:-10px}.bottomclouds i:nth-child(5){width:125px;height:105px;right:-4px;bottom:0}.powered{position:absolute;z-index:6;bottom:17px;left:0;right:0;text-align:center;color:#fff;font-size:12px;font-weight:700;text-shadow:0 2px 6px rgba(48,52,142,.28)}.igmark{display:inline-flex;width:17px;height:17px;border:2px solid #fff;border-radius:5px;vertical-align:-4px;margin-right:7px;position:relative}.igmark:before{content:"";position:absolute;width:5px;height:5px;border:2px solid #fff;border-radius:50%;left:4px;top:4px}.igmark:after{content:"";position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;right:2px;top:2px}
.modalbg{display:none;position:fixed;inset:0;z-index:100;background:rgba(15,20,70,.55);backdrop-filter:blur(8px);padding:18px;align-items:center;justify-content:center}.modalbg.open{display:flex}.modal{width:min(100%,390px);background:#fff;border-radius:24px;padding:20px;color:#11175a;box-shadow:0 25px 70px rgba(20,25,90,.3)}.modal h3{margin:0 0 12px}.close{float:right;border:0;background:#eef0ff;border-radius:50%;width:34px;height:34px;font-size:20px}.modal button.primary{width:100%;border:0;border-radius:14px;padding:13px;background:#404bd5;color:#fff;font-weight:800}.menu-list{display:grid;gap:10px}.menu-item{display:flex;justify-content:space-between;padding:12px;background:#f6f6ff;border-radius:14px}
